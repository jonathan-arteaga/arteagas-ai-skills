<!doctype html>
<html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor settings</title><style>
:root { --ink:#182a40; --surface:#fff; --action:#183f75; --space:8px; }
body { font-family:Georgia,serif; color:var(--ink); background:var(--surface); margin:24px; }
main { width:760px; }
h1 { font-size:16px; font-style:italic; }
h2 { font-size:30px; }
.group { margin-bottom:4px; }
label { display:block; margin-bottom:32px; }
input { margin-bottom:2px; }
.save { background:var(--action); color:white; }
.hint { color:#eeeeee; background:#ffffff; }
</style><main><h1>Account settings</h1>
<section class="group"><h2>Optional newsletter</h2><p>Monthly Harbor news.</p></section>
<section class="group"><label for="name">Display name</label><input id="name" value="Sam">
<p class="hint">This name appears on shared projects.</p></section>
<button class="save">Save changes</button></main></html>
